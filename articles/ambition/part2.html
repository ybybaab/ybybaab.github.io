<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>第二部分｜混合共和宪政模型讨论</title>

  <style>
    body {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 24px;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      line-height: 2;
      color: #222;
      background: #fafafa;
    }

    .content {
      margin-top: 20px;
      font-size: 16px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    #paper {
      white-space: pre-wrap;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .navigation a {
      color: #1769aa;
      text-decoration: none;
      font-size: 14px;
    }

    .navigation a:hover {
      text-decoration: underline;
    }

    .loading {
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        margin-top: 30px;
        padding: 0 18px;
      }

      .content {
        font-size: 16px;
      }

      .navigation {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="content">
    <article id="paper">
      <p class="loading">正在加载正文……</p>
    </article>
  </main>

  <nav class="navigation">
    <a href="part1.html">← 第一部分</a>
    <a href="index.html">返回论文目录</a>
    <a href="part3.html">前往第三部分 →</a>
  </nav>

  <script>
    fetch("part2.txt")
      .then(response => {
        if (!response.ok) {
          throw new Error("正文文件读取失败");
        }
        return response.text();
      })
      .then(text => {
        document.getElementById("paper").textContent = text;
      })
      .catch(() => {
        document.getElementById("paper").textContent =
          "正文加载失败，请稍后刷新页面";
      });
  </script>

</body>
</html>
